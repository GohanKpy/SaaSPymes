# Laboratorio local de desarrollo (docs/plan/11 §3).
# Levantar con:  docker compose -f docker-compose.dev.yml up -d --build
# Requiere .env.local en la raiz (cp .env.local.example .env.local).
#
# Puertos de HOST: bloque dedicado 4300-4307 para no colisionar con otros
# proyectos de la maquina (ADR 0001). Dentro de la red de Docker se mantienen
# los puertos canonicos: db:5432, minio:9000, queue:9324, mail:1025.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: pymes
    ports: ['4302:5432']
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./infra/local/init:/docker-entrypoint-initdb.d # roles, schemas, RLS
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s

  minio: # equivalente de S3
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devkey
      MINIO_ROOT_PASSWORD: devsecret123
    ports: ['4303:9000', '4304:9001']
    volumes: [miniodata:/data]

  queue: # equivalente de SQS
    image: softwaremill/elasticmq-native
    ports: ['4305:9324']
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf

  mail: # captura de correos salientes
    image: axllent/mailpit
    ports: ['4306:1025', '4307:8025']

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env.local
    depends_on:
      db: { condition: service_healthy }
    ports: ['4301:4301'] # el contenedor escucha en API_PORT (.env.local)

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: .env.local
    depends_on:
      db: { condition: service_healthy }

  web: # portal de CLIENTES (ADR 0004): /platform no existe aca
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: .env.local
    environment:
      PORTAL: client
    ports: ['4300:4300'] # el contenedor escucha en PORT (.env.local)

  webadmin: # portal del DUEÑO (ADR 0004): solo /platform, restringible por IP
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: .env.local
    environment:
      PORTAL: admin
      PORT: '4308'
    ports: ['4308:4308']

  tunnel: # Cloudflare Tunnel (testeo remoto y webhook de Meta): solo trafico
    # SALIENTE, sin puertos publicados; TUNNEL_TOKEN vive en .env.local y las
    # rutas hostname->servicio se administran en Cloudflare (tunel pymes-lab).
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file: .env.local
    depends_on: [web, webadmin, api]
    restart: unless-stopped

volumes:
  dbdata:
  miniodata:
