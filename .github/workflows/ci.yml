# CI de fase 0/1 (docs/plan/07): lint, typecheck, build y tests con la suite
# de aislamiento multitenant BLOQUEANTE contra Postgres real (docs/plan/08 §2).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: pymes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIGRATOR_DATABASE_URL: postgresql://migrator:devpass@localhost:5432/pymes
      DATABASE_URL: postgresql://app_rw:devpass@localhost:5432/pymes
      PLATFORM_DATABASE_URL: postgresql://platform_ops:devpass@localhost:5432/pymes
      # Entorno completo de la API para el e2e de aislamiento (valores de
      # juguete; las llaves JWT se generan en un step). Nada de esto es secreto.
      META_APP_SECRET: ci-app-secret
      META_VERIFY_TOKEN: ci-verify-token
      WEB_ORIGIN: http://localhost:4300
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      SQS_ENDPOINT: http://localhost:9324
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      CRYPTO_PROVIDER: local
      SMTP_HOST: localhost
      WHATSAPP_API_URL: http://localhost:9099
      INVOICING_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      # Sin version explicita: la accion lee packageManager del package.json
      # (pasar ambas y que difieran hace fallar el setup al instante).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar llaves JWT y de cifrado efimeras del job
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt.pem
          openssl pkey -in /tmp/jwt.pem -pubout -out /tmp/jwt.pub.pem
          echo "JWT_PRIVATE_KEY_BASE64=$(base64 -w0 /tmp/jwt.pem)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_BASE64=$(base64 -w0 /tmp/jwt.pub.pem)" >> "$GITHUB_ENV"
          echo "CRYPTO_LOCAL_KEY_BASE64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Preparar instancia (roles, esquemas, funciones RLS)
        run: PGPASSWORD=devpass psql -h localhost -U postgres -d pymes -f infra/local/init/01-schema.sql

      - name: Migraciones (como migrator)
        run: pnpm --filter @pymes/db run db:migrate

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (incluye suite de aislamiento multitenant, bloqueante)
        run: pnpm test
