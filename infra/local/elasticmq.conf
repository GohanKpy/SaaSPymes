// ElasticMQ: emulador local de SQS (docs/plan/11 §1).
// Regla de portabilidad: nada exclusivo del emulador; solo semantica SQS real.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

// Las colas (mensajes, facturas, emails, sync calendario) y sus DLQ
// se definen en fase 1/2, cuando exista el primer consumidor.
queues {
}
